[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "human-approval-gate"
version = "0.1.0"
description = "An AI proposes, a person decides, everything is logged."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marco Estrada" }]
dependencies = []

[project.scripts]
approval-gate = "approval_gate.cli:main"

[tool.setuptools]
packages = ["approval_gate"]
